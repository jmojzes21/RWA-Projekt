<header>
  <img class="logo" src="/assets/serije_icon.png" />
  <h1>Moje serije</h1>

  <nav>
    <a *ngFor="let n of stavkeNavigacije" [routerLink]="n.url">{{ n.tekst }}</a>
  </nav>

  <div class="flex-1"></div>

  <div *ngIf="prijavljeniKorisnik == undefined">
    <a class="prijava" routerLink="/prijava">Prijavi se</a>
  </div>

  <div *ngIf="prijavljeniKorisnik != undefined">
    {{ prijavljeniKorisnik.korisnicko_ime }}
    <a class="margin-left-10 odjava" (click)="odjaviSe()">Odjavi se</a>
  </div>
</header>
